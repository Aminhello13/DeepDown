[package]
name = "deepx-core"
version = "0.1.0"
edition = "2021"
description = "DeepDown - Universal Download Source Aggregator Engine"
authors = ["DarXone Group"]
license = "MIT"

[dependencies]
# HTTP client
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "gzip", "brotli"] }
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization (YAML/JSON registry)
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# Error handling
anyhow = "1"
thiserror = "2"
# Regex for extraction engine
regex = "1"
# Logging
log = "0.4"
env_logger = "0.11"
# CLI arg parsing
clap = { version = "4", features = ["derive"] }
# HTTP streaming download
futures-util = "0.3"
# Scraper (CSS/XPath extraction)
scraper = "0.20"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
