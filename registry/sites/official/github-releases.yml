name: GitHub Releases
base_url: https://api.github.com
category: software
region: global
language: en
search:
  path: /search/repositories?q={query}
  method: GET
  headers:
    Accept: application/json
extractor:
  type: json
  pattern: items[*].html_url
  name_field: items[*].full_name
  desc_field: items[*].description
is_free: true
vpn_required: false
created_by: Aminhello13
version: 2
